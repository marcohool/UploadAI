services:
  uploadai:
    image: ghcr.io/marcohool/uploadai:latest
    container_name: uploadai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # config.json, prompts.json and countryList.txt ship baked into the
      # image at data/ and are intentionally left unmounted. Only data/state
      # (history.json, session.json) is runtime state, so only that
      # subdirectory is persisted here, without shadowing the packaged config.
      - state:/usr/src/app/data/state
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  watchtower:
    # Maintained fork of containrrr/watchtower (unmaintained since 2023 and
    # incompatible with Docker Engine 29+). Same labels and flags.
    image: nickfedor/watchtower:1.23.0
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --cleanup --label-enable

volumes:
  state:

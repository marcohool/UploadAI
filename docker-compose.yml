services:
  uploadai:
    image: ghcr.io/marcohool/uploadai:latest
    container_name: uploadai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # config.json, prompts.json and countryList.txt ship baked into the
      # image and are intentionally left unmounted. Only the two files that
      # are runtime state are persisted here, so they survive restarts and
      # image updates without shadowing the packaged config.
      - history:/usr/src/app/data/history.json
      - session:/usr/src/app/data/session.json

volumes:
  history:
  session:

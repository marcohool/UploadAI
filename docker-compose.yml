services:
  uploadai:
    image: ghcr.io/marcohool/uploadai:latest
    container_name: uploadai
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # config.json, prompts.json and countryList.txt ship baked into the
      # image at data/ and are intentionally left unmounted. Only data/state
      # (history.json, session.json) is runtime state, so only that
      # subdirectory is persisted here, without shadowing the packaged config.
      - state:/usr/src/app/data/state

volumes:
  state:
